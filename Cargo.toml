[package]
name = "ina3221_async"
version = "0.1.0"
authors = [
  "Erik Rogers <erik@underlogic.tech>",
  "Dmytro Krasnianskyi <k.dimonych@gmail.com>",
]
edition = "2024"
repository = "https://github.com/kdimonych/ina3221_async"
license = "MIT"
description = "Async embedded driver for INA3221 triple-channel power monitor using embedded-hal-async"
readme = "README.md"
keywords = ["i2c", "driver", "embedded-hal-driver", "ina3221", "power"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
maybe-async-cfg = "0.2"
bitflags = "2.9"
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { version = "1.0", optional = true }
# Use old 32-bit version of ohms for compatibility with 32-bit targets
# TODO: switch to 64-bit version when 64-bit targets are more common
ohms = "0.2"

[features]
default = ["async"]
sync = ["embedded-hal"]
async = ["embedded-hal-async"]
